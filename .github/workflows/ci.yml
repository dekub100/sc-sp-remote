name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    # ubuntu-latest moved to 26.04, which has no Python 3.9 build; 24.04 does.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check server/ manage.py conftest.py tests/

      - name: Check JS syntax
        run: |
          for f in web/*.js web/*/*.js spicetify-extension/*.js soundcloud-plugin/*.js; do
            node --check "$f"
          done

      - name: Test
        run: python -m pytest tests/ -v

  # The project ships a Windows service, a setup.bat installer and pywin32-only
  # code paths, so the Linux matrix above cannot see regressions in those.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Import check
        run: python -c "import manage, sys; sys.path.insert(0, 'server'); import server"

      - name: Lint
        run: ruff check server/ manage.py conftest.py tests/

      - name: Test
        run: python -m pytest tests/ -q

  streamdeck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamdeck-plugin/package-lock.json

      - name: Install
        run: npm ci
        working-directory: streamdeck-plugin

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: streamdeck-plugin

      - name: Build
        run: npm run build
        working-directory: streamdeck-plugin

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test pure web helpers
        run: node --test "web/tests/*.test.js"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-test, windows, streamdeck, web-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamdeck-plugin/package-lock.json

      - name: Build Stream Deck plugin
        run: |
          cd streamdeck-plugin
          npm ci
          npm run build
          cd ..
          npx --package=@elgato/cli --yes streamdeck pack \
            streamdeck-plugin/com.dekub.sc-sp-remote.sdPlugin \
            --output . --force

      - name: Build release zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ZIP_NAME="sc-sp-remote-core-v${VERSION}.zip"
          zip -r "$ZIP_NAME" \
            README.md requirements.txt setup.bat \
            server/ data/config.default.json \
            manage.py \
            spicetify-extension/ soundcloud-plugin/ web/ \
            -x "server/__pycache__/*" "*/__pycache__/*"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --tag ${{ github.ref_name }}
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ZIP_NAME }}
            *.streamDeckPlugin
          body_path: RELEASE_NOTES.md

name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check server/ test_server.py

      - name: Test
        run: python -m pytest test_server.py -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamdeck-plugin/package-lock.json

      - name: Build Stream Deck plugin
        run: |
          cd streamdeck-plugin
          npm ci
          npm run build
          cd ..
          npx --package=@elgato/cli --yes streamdeck pack \
            streamdeck-plugin/com.dekub.sc-sp-remote.sdPlugin \
            --output . --force

      - name: Ensure default config.json
        run: |
          if [ ! -f data/config.json ]; then
            mkdir -p data
            printf '{"port":8888,"allowedOrigins":["*"],"defaultVolume":0.5,"enableOBS":true,"enableWebsite":true,"enableAlbumArt":true,"enableLyrics":true,"lyricsFetchTimeoutSeconds":30,"lyricsProviderOrder":["musixmatch","lrclib"],"musixmatchToken":"","logLevel":"INFO","backupCount":3,"spicetifyPollingIntervalMs":500,"soundcloudPollingIntervalMs":500}\n' > data/config.json
          fi

      - name: Build release zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ZIP_NAME="sc-sp-remote-core-v${VERSION}.zip"
          zip -r "$ZIP_NAME" \
            README.md requirements.txt setup.bat \
            server/ data/config.json \
            manage.py \
            spicetify-extension/ soundcloud-plugin/ web/ \
            -x "server/__pycache__/*" "*/__pycache__/*"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --tag ${{ github.ref_name }}
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            *.streamDeckPlugin
          body_path: RELEASE_NOTES.md

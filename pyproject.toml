# Tool configuration only: the server is run from a checkout with
# `python manage.py run`, not installed as a package. The release version comes
# from the git tag (see .github/workflows/ci.yml).

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["."]
asyncio_mode = "auto"
